<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year, My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff758c;
            --gold: #ffda79;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: #000000; /* Pure black background */
            overflow: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Countdown UI --- */
        #ui-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.5); /* Slightly darker backing */
            padding: 30px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: 2.8rem;
            color: var(--pink);
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
        }

        #timer { display: flex; gap: 10px; justify-content: center; }
        .unit {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px; border-radius: 15px;
            min-width: 70px; border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .unit span { display: block; font-size: 1.8rem; font-weight: bold; color: white; }
        .unit label { font-size: 0.7rem; color: #aaa; text-transform: uppercase; }

        /* --- Button --- */
        #unlockBtn {
            margin-top: 30px;
            padding: 20px 50px; font-size: 1.3rem; font-weight: bold;
            border: none; border-radius: 50px; color: #555;
            background: #2d3436; cursor: not-allowed;
            transition: all 0.5s ease;
        }

        #unlockBtn.ready {
            background: var(--pink); color: white;
            cursor: pointer; box-shadow: 0 0 30px rgba(255, 117, 140, 0.6);
            animation: glow 2s infinite;
        }

        @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

        /* --- Pop-up & Scroll --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; z-index: 100;
            justify-content: center; align-items: center;
        }

        #popup {
            width: 90%; max-width: 420px; height: 80vh;
            background: white; border-radius: 30px;
            overflow-y: auto; position: relative;
            transform: scale(0.8); opacity: 0;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #popup::-webkit-scrollbar { display: none; }
        #popup.active { transform: scale(1); opacity: 1; }

        .photo-header { width: 100%; line-height: 0; }
        .photo-header img { width: 100%; border-radius: 30px 30px 0 0; }

        .letter-body {
            padding: 30px 25px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.8rem; color: #333;
            line-height: 1.6; text-align: center;
        }

        #musicToggle {
            position: fixed; top: 20px; right: 20px;
            background: rgba(255,255,255,0.1); border: none; color: white;
            padding: 12px; border-radius: 50%; cursor: pointer; z-index: 1000; display: none;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <button id="musicToggle">🎵</button>

    <div id="ui-wrapper">
        <h1 class="title">Wait for the Magic...</h1>
        <div id="timer">
            <div class="unit"><span id="days">00</span><label>Days</label></div>
            <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
            <div class="unit"><span id="mins">00</span><label>Mins</label></div>
            <div class="unit"><span id="secs">00</span><label>Secs</label></div>
        </div>
        <button id="unlockBtn">🔒 Locked Until 2026</button>
    </div>

    <div id="overlay">
        <div id="popup">
            <div class="photo-header">
                <img src="photo.png" alt="Our Special Memory">
            </div>
            <div class="letter-body">
                <p id="typedText"></p>
                <div style="height: 100px;"></div>
                <p style="font-size: 1.2rem; opacity: 0.5;">(Scroll down ❤️)</p>
                <div style="height: 200px;"></div>
                <p>You are my favorite person in every universe.</p>
                <p>I can't wait to spend 365 more days with you.</p>
                <p style="font-size: 2.5rem; color: var(--pink);">I Love You!</p>
                <div style="height: 50px;"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. SETUP TARGET DATE (Jan 1, 2026)
        // REMEMBER TO CHANGE THIS BACK TO "Jan 1, 2026 00:00:00" BEFORE SENDING!
        const targetDate = new Date("Jan 1, 2026 00:00:00").getTime();
        
        const letter = "My Love, As 2026 begins, I just wanted to remind you how much you mean to me. This photo is a symbol of all the beautiful moments we've shared. I promise to make this year even more magical for you. Let's grow, laugh, and love together forever...";

        // 2. REALISTIC FIREWORKS ENGINE (No White Effect)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let fireworkArray = [];
        let particleArray = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Firework {
            constructor() {
                this.x = Math.random() * width;
                this.y = height;
                this.targetY = Math.random() * (height * 0.5) + 50;
                this.velocity = Math.random() * 3 + 5;
                this.hue = Math.floor(Math.random() * 360);
                this.exploded = false;
            }
            update() {
                this.y -= this.velocity;
                if (this.y <= this.targetY) {
                    this.exploded = true;
                    this.explode();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.fill();
            }
            explode() {
                for (let i = 0; i < 100; i++) {
                    particleArray.push(new Particle(this.x, this.y, this.hue));
                }
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x;
                this.y = y;
                this.hue = hue + (Math.random() * 40 - 20); // slight color variation
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 5 + 2;
                this.friction = 0.95;
                this.gravity = 0.08;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                // Removed 'lighter' composite operation to prevent white blowout
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.beginPath();
                // Using hue, saturation, lightness, alpha for rich color
                ctx.fillStyle = `hsla(${this.hue}, 100%, 55%, ${this.alpha})`;
                ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            // Use pure black with low opacity for trail effect without gray haze
            ctx.fillStyle = 'rgba(0, 0, 0, 0.25)'; 
            ctx.fillRect(0, 0, width, height);
            
            if (Math.random() < 0.04) fireworkArray.push(new Firework());

            fireworkArray.forEach((fw, i) => {
                fw.update();
                fw.draw();
                if (fw.exploded) fireworkArray.splice(i, 1);
            });

            particleArray.forEach((p, i) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particleArray.splice(i, 1);
            });

            requestAnimationFrame(animate);
        }
        animate();

        // 3. LOGIC & UNLOCK
        const unlockBtn = document.getElementById('unlockBtn');
        const audio = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('days').innerText = d < 10 ? "0"+d : d;
                document.getElementById('hours').innerText = h < 10 ? "0"+h : h;
                document.getElementById('mins').innerText = m < 10 ? "0"+m : m;
                document.getElementById('secs').innerText = s < 10 ? "0"+s : s;
            } else {
                unlockBtn.classList.add('ready');
                unlockBtn.innerHTML = "🎁 Click for Your Message ❤️";
                document.querySelector('.title').innerText = "Happy New Year, Princess!";
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        unlockBtn.addEventListener('click', () => {
            if(unlockBtn.classList.contains('ready')) {
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('ui-wrapper').style.display = 'none';
                setTimeout(() => {
                    document.getElementById('popup').classList.add('active');
                    typeWriter();
                }, 100);
                audio.play();
                musicToggle.style.display = 'block';
            }
        });

        musicToggle.addEventListener('click', () => {
             if (audio.paused) audio.play(); else audio.pause();
        });

        let i = 0;
        function typeWriter() {
            if (i < letter.length) {
                document.getElementById("typedText").innerHTML += letter.charAt(i);
                i++;
                setTimeout(typeWriter, 50);
            }
        }
    </script>
</body>
</html>
