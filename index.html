<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year, My Love</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --pink: #ff758c;
            --dark-pink: #ff5e78;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: #000000;
            overflow: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- UI Wrapper --- */
        #ui-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 25px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 400px;
            transition: opacity 0.5s ease;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 8vw, 2.8rem); 
            color: var(--pink);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
        }

        #timer { display: flex; gap: 10px; justify-content: center; }

        .unit {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px; border-radius: 15px;
            flex: 1; min-width: 65px;
            border: 1px solid rgba(255, 117, 140, 0.2);
        }

        .unit span { display: block; font-size: 1.5rem; font-weight: bold; color: white; }
        .unit label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Buttons --- */
        #unlockBtn {
            margin-top: 25px;
            padding: 16px; 
            width: 100%;
            font-size: 1rem; font-weight: bold;
            border: none; border-radius: 50px; color: #555;
            background: #1a1a1a; cursor: not-allowed;
            transition: all 0.4s ease;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        #unlockBtn.ready {
            background: var(--pink); color: white;
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }

        /* --- Pop-up Overlay --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none; z-index: 100;
            justify-content: center; align-items: center;
            padding: 20px;
        }

        #popup {
            width: 100%; max-width: 420px; 
            background: white; border-radius: 30px;
            overflow-y: auto; position: relative;
            transform: translateY(20px); opacity: 0;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            max-height: 80vh;
        }

        #popup.active { transform: translateY(0); opacity: 1; }

        /* Close Button */
        #closeBtn {
            position: absolute;
            top: 15px; right: 15px;
            width: 35px; height: 35px;
            background: rgba(0,0,0,0.5);
            color: white; border: none;
            border-radius: 50%; cursor: pointer;
            z-index: 110; display: flex;
            align-items: center; justify-content: center;
            transition: background 0.3s;
        }
        #closeBtn:hover { background: rgba(0,0,0,0.8); }

        .photo-header img { width: 100%; border-radius: 30px 30px 0 0; display: block; }

        .letter-body {
            padding: 30px 25px;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.4rem, 5vw, 1.7rem); 
            color: #333; line-height: 1.6; text-align: center;
        }

        /* --- Floating Music Control --- */
        #musicToggle {
            position: fixed; top: 20px; left: 20px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            color: white; width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; z-index: 1000; backdrop-filter: blur(10px);
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>
    
    <button id="musicToggle"><i class="fas fa-music"></i></button>

    <div id="ui-wrapper">
        <h1 class="title">Counting down...</h1>
        <div id="timer">
            <div class="unit"><span id="days">00</span><label>Days</label></div>
            <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
            <div class="unit"><span id="mins">00</span><label>Mins</label></div>
            <div class="unit"><span id="secs">00</span><label>Secs</label></div>
        </div>
        <button id="unlockBtn">
            <i class="fas fa-lock"></i> Locked Until 2026
        </button>
    </div>

    <div id="overlay">
        <div id="popup">
            <button id="closeBtn"><i class="fas fa-times"></i></button>
            <div class="photo-header">
                <img src="photo.png" alt="Our Memory">
            </div>
            <div class="letter-body">
                <p id="typedText"></p>
                <div style="height: 40px;"></div>
                <p style="font-size: 0.9rem; opacity: 0.5; font-family: 'Quicksand';">(Scroll to see more)</p>
                <div style="height: 100px;"></div>
                <p>Every year with you is better than the last.</p>
                <p>I can't wait to see your beautiful face in 2026.</p>
                <p style="font-size: 2rem; color: var(--pink); font-weight: bold;">I Love You so muchhhhh 🥹!</p>
                <div style="height: 30px;"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIG
        const targetDate = new Date("Jan 1, 2025 00:00:00").getTime();
        const letter = "My Love, Happy New Year! I know I made mistakes in 2025 that were hard to forgive, but looking back at our memories makes me so grateful to have you. You are my greatest blessing and gift from God. I loved you... I love you... and I will keep loving you more and more. Once again, I am really very sorry about the silly things which hurt your feelings, but I hope you'll forgive me. I love you so much🥺.";

        // 2. FIREWORKS (Condensed for performance)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, fireworkArray = [], particleArray = [];

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Firework {
            constructor() {
                this.x = Math.random() * width;
                this.y = height;
                this.targetY = Math.random() * (height * 0.4) + 50;
                this.velocity = Math.random() * 3 + 4;
                this.hue = Math.floor(Math.random() * 360);
                this.exploded = false;
            }
            update() {
                this.y -= this.velocity;
                if (this.y <= this.targetY) { this.exploded = true; this.explode(); }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.fill();
            }
            explode() {
                for (let i = 0; i < 60; i++) particleArray.push(new Particle(this.x, this.y, this.hue));
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y;
                this.hue = hue + (Math.random() * 20 - 10);
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 3 + 1;
                this.friction = 0.95; this.gravity = 0.07;
                this.alpha = 1; this.decay = Math.random() * 0.015 + 0.01;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.beginPath();
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.arc(this.x, this.y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, width, height);
            if (Math.random() < 0.05) fireworkArray.push(new Firework());
            fireworkArray.forEach((fw, i) => { fw.update(); fw.draw(); if (fw.exploded) fireworkArray.splice(i, 1); });
            particleArray.forEach((p, i) => { p.update(); p.draw(); if (p.alpha <= 0) particleArray.splice(i, 1); });
            requestAnimationFrame(animate);
        }
        animate();

        // 3. UI LOGIC
        const unlockBtn = document.getElementById('unlockBtn');
        const overlay = document.getElementById('overlay');
        const popup = document.getElementById('popup');
        const uiWrapper = document.getElementById('ui-wrapper');
        const audio = document.getElementById('bgMusic');
        const closeBtn = document.getElementById('closeBtn');

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('days').innerText = String(d).padStart(2, '0');
                document.getElementById('hours').innerText = String(h).padStart(2, '0');
                document.getElementById('mins').innerText = String(m).padStart(2, '0');
                document.getElementById('secs').innerText = String(s).padStart(2, '0');
            } else {
                unlockBtn.classList.add('ready');
                unlockBtn.innerHTML = '<i class="fas fa-gift"></i> Open Your Message <i class="fas fa-heart"></i>';
                document.querySelector('.title').innerText = "Happy New Year!";
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        // Open Letter
        unlockBtn.onclick = () => {
            if(unlockBtn.classList.contains('ready')) {
                overlay.style.display = 'flex';
                uiWrapper.style.opacity = '0';
                setTimeout(() => { 
                    uiWrapper.style.display = 'none';
                    popup.classList.add('active'); 
                    if(document.getElementById("typedText").innerHTML === "") typeWriter();
                }, 100);
                audio.play();
            }
        };

        // Close Letter
        closeBtn.onclick = () => {
            popup.classList.remove('active');
            setTimeout(() => {
                overlay.style.display = 'none';
                uiWrapper.style.display = 'block';
                setTimeout(() => uiWrapper.style.opacity = '1', 50);
            }, 400);
        };

        // Music Toggle
        document.getElementById('musicToggle').onclick = () => {
            if (audio.paused) audio.play(); else audio.pause();
        };

        // Typewriter Effect
        let charI = 0;
        function typeWriter() {
            if (charI < letter.length) {
                document.getElementById("typedText").innerHTML += letter.charAt(charI);
                charI++;
                setTimeout(typeWriter, 45);
            }
        }
    </script>
</body>
</html>
