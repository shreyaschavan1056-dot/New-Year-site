<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year, My Love ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff758c;
            --dark-pink: #ff5e78;
        }

        /* Essential for mobile responsiveness */
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            font-family: 'Quicksand', sans-serif;
            background: #000000;
            overflow: hidden;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            z-index: 1;
            pointer-events: none;
        }

        /* --- Responsive UI Wrapper --- */
        #ui-wrapper {
            position: relative;
            z-index: 10;
            text-align: center;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 450px;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 8vw, 2.8rem); /* Fluid font size */
            color: var(--pink);
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(255, 117, 140, 0.5);
        }

        #timer { 
            display: flex; 
            gap: 8px; 
            justify-content: center; 
            flex-wrap: wrap; /* Wraps on very small screens */
        }

        .unit {
            background: rgba(255, 255, 255, 0.1);
            padding: 10px; border-radius: 12px;
            flex: 1; /* Equal width units */
            min-width: 60px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .unit span { display: block; font-size: clamp(1.2rem, 5vw, 1.8rem); font-weight: bold; color: white; }
        .unit label { font-size: 0.6rem; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }

        /* --- Button --- */
        #unlockBtn {
            margin-top: 25px;
            padding: 15px 30px; 
            width: 100%;
            font-size: 1.1rem; font-weight: bold;
            border: none; border-radius: 50px; color: #777;
            background: #222; cursor: not-allowed;
            transition: all 0.4s ease;
        }

        #unlockBtn.ready {
            background: var(--pink); color: white;
            cursor: pointer; box-shadow: 0 0 20px rgba(255, 117, 140, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* --- Pop-up Overlay --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none; z-index: 100;
            justify-content: center; align-items: center;
            padding: 15px;
        }

        #popup {
            width: 100%;
            max-width: 420px; 
            height: auto;
            max-height: 85vh; /* Prevents overflow on short screens */
            background: white; border-radius: 25px;
            overflow-y: auto; position: relative;
            transform: scale(0.9); opacity: 0;
            transition: all 0.5s ease-out;
            -webkit-overflow-scrolling: touch; /* Smooth scroll on iOS */
        }

        #popup::-webkit-scrollbar { display: none; }
        #popup.active { transform: scale(1); opacity: 1; }

        .photo-header { width: 100%; line-height: 0; }
        .photo-header img { 
            width: 100%; 
            border-radius: 25px 25px 0 0; 
            display: block; 
        }

        .letter-body {
            padding: 25px 20px;
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.4rem, 5vw, 1.8rem); 
            color: #333;
            line-height: 1.5; text-align: center;
        }

        /* --- Floating Controls --- */
        #musicToggle {
            position: fixed; top: 15px; right: 15px;
            background: rgba(255,255,255,0.15); border: none; color: white;
            width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; z-index: 1000; display: none;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <button id="musicToggle">🎵</button>

    <div id="ui-wrapper">
        <h1 class="title">Waiting for 2026...</h1>
        <div id="timer">
            <div class="unit"><span id="days">00</span><label>Days</label></div>
            <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
            <div class="unit"><span id="mins">00</span><label>Mins</label></div>
            <div class="unit"><span id="secs">00</span><label>Secs</label></div>
        </div>
        <button id="unlockBtn">🔒 Locked Until Midnight</button>
    </div>

    <div id="overlay">
        <div id="popup">
            <div class="photo-header">
                <img src="photo.png" alt="Memory">
            </div>
            <div class="letter-body">
                <p id="typedText"></p>
                <div style="height: 60px;"></div>
                <p style="font-size: 1rem; opacity: 0.4; font-family: 'Quicksand';">(Scroll down for more 🥹)</p>
                <div style="height: 150px;"></div>
                <p>Every year with you is better than the last.</p>
                <p>I can't wait to see your beautiful face in 2026.</p>
                <p style="font-size: 2.2rem; color: var(--pink);">I Love Youuuu sooo muchhhhhhh 🥺!</p>
                <div style="height: 40px;"></div>
            </div>
        </div>
    </div>

    <script>
        // 1. DATE CONFIG (Set to Jan 1, 2026)
        const targetDate = new Date("Jan 1, 2025 00:00:00").getTime();
        const letter = "My Love, Happy New Year! ✨ I know, I make mistake in 2025 that you never forgive me but Looking back at our memories makes me so grateful to have you. You are my greatest blessing and gift from god, I loved....I love you..... and keep loving you more and more<3 Once again last I'm really really very sorry about my silly things which hurted your feelings but I hope you'll forgive me.... lovee you soo muchh🥺❤️... ";

        // 2. RESPONSIVE FIREWORKS ENGINE (Vivid Color, No White Wash)
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, fireworkArray = [], particleArray = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        class Firework {
            constructor() {
                this.x = Math.random() * width;
                this.y = height;
                this.targetY = Math.random() * (height * 0.4) + 50;
                this.velocity = Math.random() * 3 + 5;
                this.hue = Math.floor(Math.random() * 360);
                this.exploded = false;
            }
            update() {
                this.y -= this.velocity;
                if (this.y <= this.targetY) {
                    this.exploded = true;
                    this.explode();
                }
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.fill();
            }
            explode() {
                const count = width < 500 ? 50 : 100; // Fewer particles on mobile for performance
                for (let i = 0; i < count; i++) {
                    particleArray.push(new Particle(this.x, this.y, this.hue));
                }
            }
        }

        class Particle {
            constructor(x, y, hue) {
                this.x = x; this.y = y;
                this.hue = hue + (Math.random() * 30 - 15);
                this.angle = Math.random() * Math.PI * 2;
                this.speed = Math.random() * 4 + 1;
                this.friction = 0.96;
                this.gravity = 0.1;
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.01;
            }
            update() {
                this.speed *= this.friction;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed + this.gravity;
                this.alpha -= this.decay;
            }
            draw() {
                ctx.globalCompositeOperation = 'source-over'; 
                ctx.beginPath();
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.arc(this.x, this.y, 1.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; 
            ctx.fillRect(0, 0, width, height);
            if (Math.random() < 0.04) fireworkArray.push(new Firework());
            fireworkArray.forEach((fw, i) => { fw.update(); fw.draw(); if (fw.exploded) fireworkArray.splice(i, 1); });
            particleArray.forEach((p, i) => { p.update(); p.draw(); if (p.alpha <= 0) particleArray.splice(i, 1); });
            requestAnimationFrame(animate);
        }
        animate();

        // 3. UI LOGIC
        const unlockBtn = document.getElementById('unlockBtn');
        const audio = document.getElementById('bgMusic');
        const musicToggle = document.getElementById('musicToggle');

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;

            if (diff > 0) {
                const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                const s = Math.floor((diff % (1000 * 60)) / 1000);
                document.getElementById('days').innerText = d < 10 ? "0"+d : d;
                document.getElementById('hours').innerText = h < 10 ? "0"+h : h;
                document.getElementById('mins').innerText = m < 10 ? "0"+m : m;
                document.getElementById('secs').innerText = s < 10 ? "0"+s : s;
            } else {
                unlockBtn.classList.add('ready');
                unlockBtn.innerHTML = "🎁 Click for Your Message ❤️";
                document.querySelector('.title').innerText = "Happy New Year, Love!";
            }
        }
        setInterval(updateTimer, 1000);
        updateTimer();

        unlockBtn.addEventListener('click', () => {
            if(unlockBtn.classList.contains('ready')) {
                document.getElementById('overlay').style.display = 'flex';
                document.getElementById('ui-wrapper').style.display = 'none';
                setTimeout(() => {
                    document.getElementById('popup').classList.add('active');
                    typeWriter();
                }, 100);
                audio.play();
                musicToggle.style.display = 'block';
            }
        });

        musicToggle.addEventListener('click', () => {
             if (audio.paused) audio.play(); else audio.pause();
        });

        let charI = 0;
        function typeWriter() {
            if (charI < letter.length) {
                document.getElementById("typedText").innerHTML += letter.charAt(charI);
                charI++;
                setTimeout(typeWriter, 50);
            }
        }
    </script>
</body>
</html>
