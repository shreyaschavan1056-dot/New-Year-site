<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Happy New Year, My Love</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --pink: #ff758c;
            --glass: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }

        body, html {
            width: 100%; height: 100%; height: 100dvh;
            font-family: 'Quicksand', sans-serif;
            background: #000; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            touch-action: none;
        }

        canvas { position: absolute; top: 0; left: 0; z-index: 1; width: 100%; height: 100%; cursor: crosshair; }

        /* --- Adaptive UI --- */
        #ui-wrapper {
            position: relative; z-index: 10; text-align: center;
            background: rgba(0, 0, 0, 0.7);
            padding: clamp(20px, 5vh, 60px);
            border-radius: 40px; backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            width: 90%; max-width: 800px;
            transition: all 0.5s ease;
        }

        .title {
            font-family: 'Dancing Script', cursive;
            font-size: clamp(1.8rem, 8vw, 4rem); 
            color: var(--pink); margin-bottom: 25px;
            text-shadow: 0 0 20px rgba(255, 117, 140, 0.5);
        }

        #timer { 
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: clamp(8px, 2vw, 25px); margin-bottom: 30px;
        }

        .unit {
            background: var(--glass); padding: clamp(10px, 3vh, 30px);
            border-radius: 20px; border: 1px solid rgba(255, 117, 140, 0.2);
        }

        .unit span { display: block; font-size: clamp(1.2rem, 5vw, 3rem); font-weight: 700; color: #fff; }
        .unit label { font-size: clamp(0.5rem, 1.2vw, 0.8rem); color: #ccc; text-transform: uppercase; letter-spacing: 1px; }

        #unlockBtn {
            padding: 18px 40px; font-size: 1.1rem; font-weight: 700;
            border: none; border-radius: 50px; color: #555; background: #222; 
            cursor: not-allowed; transition: all 0.4s ease;
            display: inline-flex; align-items: center; gap: 10px;
        }

        #unlockBtn.ready {
            background: var(--pink); color: #fff; cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 117, 140, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        /* --- Letter Popup (The Collage Section) --- */
        #overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95); display: none; z-index: 100;
            justify-content: center; align-items: center; padding: 15px;
        }

        #popup {
            width: 100%; max-width: 600px; background: #fff; 
            border-radius: 35px; overflow-y: auto; position: relative;
            transform: translateY(30px); opacity: 0;
            transition: all 0.6s cubic-bezier(0.2, 1, 0.3, 1);
            max-height: 90vh; /* Keeps it within screen bounds */
        }

        #popup.active { transform: translateY(0); opacity: 1; }

        #closeBtn {
            position: absolute; top: 15px; right: 15px;
            width: 40px; height: 40px; background: rgba(0,0,0,0.5);
            color: #fff; border: none; border-radius: 50%; 
            cursor: pointer; z-index: 120; display: flex; align-items: center; justify-content: center;
        }

        /* collage formatting */
        .photo-header {
            width: 100%;
            background: #f0f0f0; /* Slight background if image aspect ratio is very different */
            line-height: 0;
        }

        .photo-header img { 
            width: 100%; 
            height: auto; /* Ensures the height follows the width */
            object-fit: contain; /* CRITICAL: Shows the whole image, no cropping */
            display: block;
            border-radius: 35px 35px 0 0;
        }

        .letter-body {
            padding: 30px 20px; font-family: 'Dancing Script', cursive;
            font-size: clamp(1.4rem, 4vw, 2rem); color: #333; 
            line-height: 1.6; text-align: center;
        }

        /* --- Floating Controls --- */
        #musicToggle {
            position: fixed; top: 20px; left: 20px;
            background: var(--glass); border: 1px solid var(--glass-border);
            color: #fff; width: 45px; height: 45px; border-radius: 50%; 
            cursor: pointer; z-index: 1000; backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>
    <audio id="bgMusic" loop><source src="music.mp3" type="audio/mpeg"></audio>
    <button id="musicToggle"><i class="fas fa-music"></i></button>

    <div id="ui-wrapper">
        <h1 class="title">Waiting for 2026</h1>
        <div id="timer">
            <div class="unit"><span id="days">00</span><label>Days</label></div>
            <div class="unit"><span id="hours">00</span><label>Hrs</label></div>
            <div class="unit"><span id="mins">00</span><label>Mins</label></div>
            <div class="unit"><span id="secs">00</span><label>Secs</label></div>
        </div>
        <button id="unlockBtn"><i class="fas fa-lock"></i> Locked Until Midnight</button>
    </div>

    <div id="overlay">
        <div id="popup">
            <button id="closeBtn"><i class="fas fa-times"></i></button>
            <div class="photo-header">
                <img src="photo.png" alt="Our Collage">
            </div>
            <div class="letter-body">
                <p id="typedText"></p>
                <div style="height: 100px;"></div>
                <p>Every year with you is better than the last.</p>
                <p>I can't wait to see your beautiful face in 2026.</p>
                <p style="font-size: 2.2rem; color: var(--pink); font-weight: bold;">I Love You so much!</p>
                <div style="height: 30px;"></div>
            </div>
        </div>
    </div>

    <script>
        const targetDate = new Date("Jan 1, 2025 00:00:00").getTime();
        const letter = "My Love, Happy New Year! I know I made mistakes in 2025 that were hard to forgive, but looking back at our memories makes me so grateful to have you. You are my greatest blessing and gift from God. I loved you... I love you... and I will keep loving you more and more. Once again, I am really very sorry about the silly things which hurt your feelings, but I hope you'll forgive me. I love you so much.";

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width, height, fireworks = [], particles = [];

        function resize() { width = canvas.width = window.innerWidth; height = canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        class Firework {
            constructor(sx, sy, tx, ty) {
                this.x = sx; this.y = sy; this.tx = tx; this.ty = ty;
                this.dist = Math.hypot(tx-sx, ty-sy);
                this.ang = Math.atan2(ty-sy, tx-sx);
                this.speed = 15; this.hue = Math.random()*360;
            }
            update(i) {
                this.x += Math.cos(this.ang)*this.speed;
                this.y += Math.sin(this.ang)*this.speed;
                if(Math.hypot(this.tx-this.x, this.ty-this.y) < this.speed) {
                    this.explode(); fireworks.splice(i, 1);
                }
            }
            draw() {
                ctx.strokeStyle = `hsl(${this.hue}, 100%, 60%)`;
                ctx.beginPath(); ctx.moveTo(this.x, this.y);
                ctx.lineTo(this.x - Math.cos(this.ang)*10, this.y - Math.sin(this.ang)*10); ctx.stroke();
            }
            explode() {
                for(let i=0; i<70; i++) particles.push(new Particle(this.tx, this.ty, this.hue));
            }
        }

        class Particle {
            constructor(x, y, h) {
                this.x = x; this.y = y; this.hue = h + (Math.random()*20-10);
                this.ang = Math.random()*Math.PI*2; this.speed = Math.random()*6+1;
                this.friction = 0.95; this.gravity = 0.1; this.alpha = 1; this.decay = 0.02;
            }
            update(i) {
                this.speed *= this.friction; this.x += Math.cos(this.ang)*this.speed;
                this.y += Math.sin(this.ang)*this.speed + this.gravity; this.alpha -= this.decay;
                if(this.alpha <= 0) particles.splice(i, 1);
            }
            draw() {
                ctx.fillStyle = `hsla(${this.hue}, 100%, 60%, ${this.alpha})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, 1.5, 0, Math.PI*2); ctx.fill();
            }
        }

        // Gesture Interaction
        function launch(e) {
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;
            fireworks.push(new Firework(width/2, height, x, y));
        }
        canvas.addEventListener('mousedown', launch);
        canvas.addEventListener('touchstart', launch);

        function animate() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)'; ctx.fillRect(0,0,width,height);
            if(Math.random() < 0.04) fireworks.push(new Firework(Math.random()*width, height, Math.random()*width, Math.random()*height/2));
            fireworks.forEach((f, i) => { f.draw(); f.update(i); });
            particles.forEach((p, i) => { p.draw(); p.update(i); });
            requestAnimationFrame(animate);
        }
        animate();

        const unlockBtn = document.getElementById('unlockBtn');
        const overlay = document.getElementById('overlay');
        const audio = document.getElementById('bgMusic');

        function updateTimer() {
            const now = new Date().getTime();
            const diff = targetDate - now;
            if (diff > 0) {
                const d = Math.floor(diff/(1000*60*60*24)), h = Math.floor((diff%(1000*60*60*24))/(1000*60*60)), 
                      m = Math.floor((diff%(1000*60*60))/(1000*60)), s = Math.floor((diff%(1000*60))/1000);
                document.getElementById('days').innerText = String(d).padStart(2,'0');
                document.getElementById('hours').innerText = String(h).padStart(2,'0');
                document.getElementById('mins').innerText = String(m).padStart(2,'0');
                document.getElementById('secs').innerText = String(s).padStart(2,'0');
            } else {
                unlockBtn.classList.add('ready'); unlockBtn.innerHTML = '<i class="fas fa-gift"></i> Open Your Message <i class="fas fa-heart"></i>';
                document.querySelector('.title').innerText = "Happy New Year!";
            }
        }
        setInterval(updateTimer, 1000); updateTimer();

        unlockBtn.onclick = () => {
            if(unlockBtn.classList.contains('ready')) {
                overlay.style.display = 'flex';
                setTimeout(() => { document.getElementById('popup').classList.add('active'); typeWriter(); }, 100);
                audio.play();
            }
        };

        document.getElementById('closeBtn').onclick = () => {
            document.getElementById('popup').classList.remove('active');
            setTimeout(() => overlay.style.display = 'none', 500);
        };

        document.getElementById('musicToggle').onclick = () => { audio.paused ? audio.play() : audio.pause(); };

        let charI = 0;
        function typeWriter() {
            if (charI < letter.length) {
                document.getElementById("typedText").innerHTML += letter.charAt(charI);
                charI++; setTimeout(typeWriter, 40);
            }
        }
    </script>
</body>
</html>
